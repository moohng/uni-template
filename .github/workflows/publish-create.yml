name: Publish @unimp/create to npm

on:
  push:
    tags:
      - 'create-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Get package version
        id: version
        run: |
          VERSION=$(node -p "require('./packages/create/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          echo "@unimp:registry=https://registry.npmjs.org/" >> .npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        working-directory: packages/create
        run: npm publish --access public

      - name: Publish success
        run: echo "Published @unimp/create@${{ steps.version.outputs.version }}"
